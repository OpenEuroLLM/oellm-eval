  reasoning:
    description: "Reasoning tasks: GSM8k (4-shot), IFEval (0-shot), MBPP (3-shot), GPQA-Diamond (0-shot), MATH500 (0-shot), LiveCodeBench (0-shot), HumanEval (0-shot), AIME24 (0-shot), AIME25 (0-shot), AMC23 (0-shot)"
    suite: lm-eval-harness
    # The evalchemy-routed tasks (GPQADiamond, MATH500, LiveCodeBench, HumanEval,
    # AIME24/25, AMC23) declare no metric: output key shape unverified; the
    # scheduler warns and collect falls back to METRIC_FALLBACK_KEYS.
    tasks:
      - task: gsm8k
        metric: exact_match,strict-match  # the benchmark's original strict answer extraction; English output is format-stable
        n_shots: [4]
        dataset: openai/gsm8k
        subset: main
      - task: ifeval
        metric: prompt_level_strict_acc  # the usual single-number pick
        n_shots: [0]
        dataset: google/IFEval
      - task: mbpp
        metric: pass_at_1
        n_shots: [3]
        dataset: google-research-datasets/mbpp
      - task: GPQADiamond
        n_shots: [0]
        suite: evalchemy
      - task: MATH500
        n_shots: [0]
        suite: evalchemy
      - task: LiveCodeBench
        n_shots: [0]
        suite: evalchemy
        dataset: livecodebench/code_generation_lite
      - task: HumanEval
        n_shots: [0]
        suite: evalchemy
      - task: AIME24
        n_shots: [0]
        suite: evalchemy
      - task: AIME25
        n_shots: [0]
        suite: evalchemy
      - task: AMC23
        n_shots: [0]
        suite: evalchemy

