                  srp_Cyrl, tur_Latn, ukr_Cyrl, isl_Latn, nob_Latn]
    tasks:
      - task: "flores200_eng_Latn-{lang}_bpb"
        subset: "eng_Latn-{lang}"

  belebele-eu-bpb:
    description: "Bits-per-byte on Belebele European languages, cloze form (0-shot)"
    suite: lm-eval-harness
    n_shots: [0]
    dataset: facebook/belebele
