task_groups:
  sib200-eu:
    description: "SIB-200 European language topic classification tasks (0-shot)"
    suite: lm-eval-harness
    metric: acc_norm
    n_shots: [0]
    dataset: Davlan/sib200
    valid_langs: [bul_Cyrl, hrv_Latn, ces_Latn, dan_Latn, nld_Latn, eng_Latn, est_Latn, fin_Latn,
                  fra_Latn, deu_Latn, ell_Grek, hun_Latn, gle_Latn, ita_Latn, lvs_Latn, lit_Latn,
                  mlt_Latn, pol_Latn, por_Latn, ron_Latn, slk_Latn, slv_Latn, spa_Latn, swe_Latn,
                  cat_Latn, eus_Latn, glg_Latn, bos_Latn, kat_Geor, mkd_Cyrl, als_Latn, srp_Cyrl,
                  tur_Latn, ukr_Cyrl, isl_Latn, nob_Latn]
    tasks:
      - task: "sib200_{lang}"
        subset: "{lang}"
  open-sci-0.01:
    description: "open-sci-ref 0.01 evals"
    suite: lm-eval-harness
    metric: acc
    tasks:
      - task: copa
        n_shots: [0]
        dataset: aps/super_glue
        subset: copa
      - task: social_iqa
        n_shots: [0]
        dataset: allenai/social_i_qa
      - task: openbookqa
        metric: acc_norm
        n_shots: [0]
        dataset: allenai/openbookqa
      - task: lambada_openai
        n_shots: [0]
        dataset: EleutherAI/lambada_openai
      - task: winogrande
        n_shots: [0]
        dataset: allenai/winogrande
        subset: winogrande_xl
      - task: mmlu
        n_shots: [5]
        dataset: cais/mmlu
      - task: hellaswag
        metric: acc_norm
        n_shots: [10]
        dataset: Rowan/hellaswag
      - task: arc_easy
        metric: acc_norm
        n_shots: [10]
        dataset: allenai/ai2_arc
        subset: ARC-Easy
      - task: arc_challenge
        metric: acc_norm
        n_shots: [10]
        dataset: allenai/ai2_arc
        subset: ARC-Challenge
      - task: commonsense_qa
        n_shots: [10]
        dataset: tau/commonsense_qa
      - task: piqa
        metric: acc_norm
        n_shots: [10]
        dataset: baber/piqa
      - task: boolq
        n_shots: [10]
        dataset: aps/super_glue
        subset: boolq
  belebele-eu-5-shot:
    description: "Belebele European language tasks"
    suite: lm-eval-harness
    metric: acc  # paper convention; the _cf variants stay acc_norm
    n_shots: [5]
    dataset: facebook/belebele
    valid_langs: [bul_Cyrl, hrv_Latn, ces_Latn, dan_Latn, nld_Latn, eng_Latn, est_Latn, fin_Latn,
                  fra_Latn, deu_Latn, ell_Grek, hun_Latn, ita_Latn, lvs_Latn, lit_Latn, mlt_Latn,
                  pol_Latn, por_Latn, ron_Latn, slk_Latn, slv_Latn, spa_Latn, swe_Latn, nob_Latn]
    tasks:
      - task: "belebele_{lang}"
        subset: "{lang}"
  belebele-eu-cf:
    description: "Belebele European language tasks (cloze formulation, lighteval)"
    suite: lighteval
    metric: acc_norm
    n_shots: [0]
    dataset: facebook/belebele
    valid_langs: [bul_Cyrl, hrv_Latn, ces_Latn, dan_Latn, nld_Latn, eng_Latn, est_Latn, fin_Latn,
                  fra_Latn, deu_Latn, ell_Grek, hun_Latn, ita_Latn, lvs_Latn, lit_Latn, mlt_Latn,
                  pol_Latn, por_Latn, ron_Latn, slk_Latn, slv_Latn, spa_Latn, swe_Latn, nob_Latn,
                  eus_Latn, cat_Latn]
    tasks:
      - task: "belebele_{lang}_cf"
        subset: "{lang}"

  xcsqa-eu:
    description: "XCSQA EU commonsense QA (0-shot MCQ, acc_norm)"
    suite: lm-eval-harness
    metric: acc_norm
    n_shots: [0]
    dataset: INK-USC/xcsr
    tasks:
      - task: xcsqa_deu_Latn
        subset: X-CSQA-de
      - task: xcsqa_eng_Latn
        subset: X-CSQA-en
      - task: xcsqa_spa_Latn
        subset: X-CSQA-es
      - task: xcsqa_fra_Latn
        subset: X-CSQA-fr
      - task: xcsqa_ita_Latn
        subset: X-CSQA-it
      - task: xcsqa_nld_Latn
        subset: X-CSQA-nl
      - task: xcsqa_pol_Latn
        subset: X-CSQA-pl
      - task: xcsqa_por_Latn
        subset: X-CSQA-pt

  pawsx-eu:
    description: "PAWS-X EU paraphrase detection (0-shot, acc)"
    suite: lm-eval-harness
    metric: acc
    n_shots: [0]
    dataset: google-research-datasets/paws-x
    tasks:
      - task: pawsx_deu_Latn
        subset: de
      - task: pawsx_eng_Latn
        subset: en
      - task: pawsx_spa_Latn
        subset: es
      - task: pawsx_fra_Latn
        subset: fr

  xnli-eu:
    description: "XNLI EU natural language inference (0-shot, acc)"
    suite: lm-eval-harness
    metric: acc
    n_shots: [0]
    dataset: facebook/xnli
    tasks:
      - task: xnli_bul_Cyrl
        subset: bg
      - task: xnli_deu_Latn
        subset: de
      - task: xnli_ell_Grek
        subset: el
      - task: xnli_eng_Latn
        subset: en
      - task: xnli_spa_Latn
        subset: es
      - task: xnli_fra_Latn
        subset: fr

  flores-200-eu-to-eng:
    description: "Flores 200 EU->English translation (4-shot, chrf++)."
    suite: lighteval
    metric: chrf++
    n_shots: [4]
    dataset: facebook/flores
    valid_langs: [bul_Cyrl, hrv_Latn, ces_Latn, dan_Latn, nld_Latn, est_Latn,
                  fin_Latn, fra_Latn, deu_Latn, ell_Grek, hun_Latn, gle_Latn,
                  ita_Latn, lvs_Latn, lit_Latn, mlt_Latn, pol_Latn, por_Latn,
                  ron_Latn, slk_Latn, slv_Latn, spa_Latn, swe_Latn, cat_Latn,
                  eus_Latn, glg_Latn, bos_Latn, kat_Geor, mkd_Cyrl, als_Latn,
                  srp_Cyrl, tur_Latn, ukr_Cyrl, isl_Latn, nob_Latn]
    tasks:
      - task: "flores200:{lang}-eng_Latn"
  flores-200-eng-to-eu:
    description: "Flores 200 English->EU translation (4-shot, chrf++)."
    suite: lighteval
    metric: chrf++
    n_shots: [4]
    dataset: facebook/flores
    valid_langs: [bul_Cyrl, hrv_Latn, ces_Latn, dan_Latn, nld_Latn, est_Latn,
                  fin_Latn, fra_Latn, deu_Latn, ell_Grek, hun_Latn, gle_Latn,
                  ita_Latn, lvs_Latn, lit_Latn, mlt_Latn, pol_Latn, por_Latn,
                  ron_Latn, slk_Latn, slv_Latn, spa_Latn, swe_Latn, cat_Latn,
                  eus_Latn, glg_Latn, bos_Latn, kat_Geor, mkd_Cyrl, als_Latn,
                  srp_Cyrl, tur_Latn, ukr_Cyrl, isl_Latn, nob_Latn]
    tasks:
      - task: "flores200:eng_Latn-{lang}"
  global-mmlu-eu:
    description: "Global MMLU EU tasks"
    suite: lm-eval-harness
    metric: acc
    n_shots: [5]
    dataset: CohereForAI/Global-MMLU
    valid_langs: [cs, de, el, en, es, fr, it, lt, nl, pl, pt, ro, sr, sv, tr, uk]
    tasks:
      - task: "global_mmlu_full_{lang}"
        subset: "{lang}"
  mmlu-prox-eu:
    description: "MMLU-ProX EU subset, 5-shot CoT, exact-match."
    suite: lm-eval-harness
    metric: exact_match
    n_shots: [5]
    dataset: li-lab/MMLU-ProX
    valid_langs: [cs, de, en, es, fr, hu, it, pt, sr, uk]
    tasks:
      - task: "mmlu_prox_{lang}"
        subset: "{lang}"
  mgsm-eu:
    description: "EU Language GSM benchmarks in Aya Expanse"
    suite: lm-eval-harness
    metric: exact_match,flexible-extract  # CoT output formats vary across languages; strict-match scores differ by several points
    n_shots: [5]
    dataset: juletxara/mgsm
    tasks:
      - task: mgsm_native_cot_en
        subset: en
      - task: mgsm_native_cot_de
        subset: de
      - task: mgsm_native_cot_es
        subset: es
      - task: mgsm_native_cot_fr
        subset: fr

  global-mgsm-eu:
    description: "Global-MGSM EU grade-school math (0-shot, exact_match)."
    suite: lm-eval-harness
    metric: exact_match
    n_shots: [0]
    dataset: CohereLabs/global-mgsm
    valid_langs: [de, fr, es, el, cs, hu, en, ca, eu, gl, sr]
    tasks:
      - task: "global_mgsm_{lang}"
        subset: "{lang}"

  mmmlu-eu:
    description: "MMMLU (human-translated MMLU), EU subset, 5-shot acc."
    suite: lm-eval-harness
    metric: acc
    n_shots: [5]
    dataset: openai/MMMLU
    tasks:
      - task: mmmlu_de_de
        subset: DE_DE
      - task: mmmlu_es_la
        subset: ES_LA
      - task: mmmlu_fr_fr
        subset: FR_FR
      - task: mmmlu_it_it
        subset: IT_IT
      - task: mmmlu_pt_br
        subset: PT_BR

  generic-multilingual:
    description: "Generic multilingual benchmarks in Aya Expanse"
    suite: lm-eval-harness
    metric: acc
    n_shots: [0]
    tasks:
      - task: xwinograd
        dataset: Muennighoff/xwinograd
      - task: xcopa
        dataset: xcopa  # the id lm-eval loads; offline caches are keyed by it
      - task: xstorycloze
        dataset: juletxara/xstory_cloze

  include:
    description: "INCLUDE benchmarks in Aya Expanse"
    suite: lm-eval-harness
    metric: acc
    n_shots: [0]
    dataset: CohereForAI/include-base-44
    tasks:
      - task: include_base_44_albanian
        subset: Albanian
      - task: include_base_44_basque
        subset: Basque
      - task: include_base_44_bulgarian
        subset: Bulgarian
      - task: include_base_44_croatian
        subset: Croatian
      - task: include_base_44_dutch
        subset: Dutch
      - task: include_base_44_estonian
        subset: Estonian
      - task: include_base_44_finnish
        subset: Finnish
      - task: include_base_44_french
        subset: French
      - task: include_base_44_georgian
        subset: Georgian
      - task: include_base_44_german
        subset: German
      - task: include_base_44_greek
        subset: Greek
      - task: include_base_44_hungarian
        subset: Hungarian
      - task: include_base_44_italian
        subset: Italian
      - task: include_base_44_lithuanian
        subset: Lithuanian
      - task: include_base_44_north macedonian
        subset: North Macedonian
      - task: include_base_44_polish
        subset: Polish
      - task: include_base_44_portuguese
        subset: Portuguese
      - task: include_base_44_serbian
        subset: Serbian
      - task: include_base_44_spanish
        subset: Spanish
      - task: include_base_44_turkish
        subset: Turkish
      - task: include_base_44_ukrainian
        subset: Ukrainian

  # ── Image Modality (lmms-eval) ────────────────────────────────────────────
  image-vqa:
    description: "Image VQA benchmarks via lmms-eval (VQAv2, MMBench, MMMU, ChartQA, DocVQA, TextVQA, OCRBench, MathVista)"
    suite: lmms_eval
    n_shots: [0]
    tasks:
      - task: vqav2_val
        metric: exact_match  # lmms-eval misnomer: the soft VQA accuracy min(matching/3, 1), not strict equality
        dataset: lmms-lab/VQAv2
      - task: mmbench_en_dev
        metric: gpt_eval_score
        dataset: lmms-lab/MMBench
      - task: mmmu_val
        metric: mmmu_acc
        dataset: lmms-lab/MMMU
      - task: chartqa
        metric: relaxed_overall
        dataset: lmms-lab/ChartQA
      - task: docvqa_val
        metric: anls
        dataset: lmms-lab/DocVQA
        subset: DocVQA
      - task: textvqa_val
        metric: exact_match  # same soft VQA accuracy as vqav2_val
        dataset: lmms-lab/textvqa
      - task: ocrbench
        metric: ocrbench_accuracy
        dataset: echo840/OCRBench
      - task: mathvista_testmini_cot
        metric: llm_as_judge_eval
        dataset: AI4Math/MathVista
      - task: mathvista_testmini_format
        metric: llm_as_judge_eval
        dataset: AI4Math/MathVista
      - task: mathvista_testmini_solution
        metric: llm_as_judge_eval
        dataset: AI4Math/MathVista

  # ── Individual Image Benchmarks (single-task groups for targeted runs) ──────
  image-vqav2:
    description: "VQAv2 visual question answering via lmms-eval"
    suite: lmms_eval
    metric: exact_match
    n_shots: [0]
    tasks:
      - task: vqav2_val
        dataset: lmms-lab/VQAv2

  image-mmbench:
    description: "MMBench multi-modal benchmark via lmms-eval"
    suite: lmms_eval
    metric: gpt_eval_score
    n_shots: [0]
    tasks:
      - task: mmbench_en_dev
        dataset: lmms-lab/MMBench

  image-mmmu:
    description: "MMMU massive multi-discipline multimodal understanding via lmms-eval"
    suite: lmms_eval
    metric: mmmu_acc
    n_shots: [0]
    tasks:
      - task: mmmu_val
        dataset: lmms-lab/MMMU

  image-chartqa:
    description: "ChartQA chart question answering via lmms-eval"
    suite: lmms_eval
    metric: relaxed_overall
    n_shots: [0]
    tasks:
      - task: chartqa
        dataset: lmms-lab/ChartQA

  image-docvqa:
    description: "DocVQA document visual question answering via lmms-eval"
    suite: lmms_eval
    metric: anls
    n_shots: [0]
    tasks:
      - task: docvqa_val
        dataset: lmms-lab/DocVQA
        subset: DocVQA

  image-textvqa:
    description: "TextVQA text-based visual question answering via lmms-eval"
    suite: lmms_eval
    metric: exact_match
    n_shots: [0]
    tasks:
      - task: textvqa_val
        dataset: lmms-lab/textvqa

  image-ocrbench:
    description: "OCRBench optical character recognition benchmark via lmms-eval"
    suite: lmms_eval
    metric: ocrbench_accuracy
    n_shots: [0]
    tasks:
      - task: ocrbench
        dataset: echo840/OCRBench

  image-mme:
    description: "MME multimodal evaluation benchmark via lmms-eval"
    suite: lmms_eval
    metric: mme_cognition_score
    n_shots: [0]
    tasks:
      - task: mme
        dataset: lmms-lab/MME

  image-mathvista:
    description: "MathVista mathematical reasoning in visual contexts via lmms-eval (testmini CoT/format/solution leaves)"
    suite: lmms_eval
    metric: llm_as_judge_eval
    n_shots: [0]
    dataset: AI4Math/MathVista
    tasks:
      - task: mathvista_testmini_cot
      - task: mathvista_testmini_format
      - task: mathvista_testmini_solution

  # ── Image Modality: additional benchmarks (lmms-eval, rule-based) ─────────
  image-ocrbench-v2:
    description: "OCRBench v2 OCR benchmark (rule-based) via lmms-eval"
    suite: lmms_eval
    metric: ocrbench_v2_accuracy
    n_shots: [0]
    tasks:
      - task: ocrbench_v2
        dataset: ling99/OCRBench_v2

  image-realworldqa:
    description: "RealWorldQA real-world spatial/visual understanding via lmms-eval"
    suite: lmms_eval
    metric: exact_match
    n_shots: [0]
    tasks:
      - task: realworldqa
        dataset: lmms-lab/RealWorldQA

  image-mme-realworld:
    description: "MME-RealWorld (EN) high-resolution real-world MCQ via lmms-eval"
    suite: lmms_eval
    metric: mme_realworld_score
    n_shots: [0]
    tasks:
      - task: mmerealworld
        dataset: yifanzhang114/MME-RealWorld-Lmms-eval

  image-mmstar:
    description: "MMStar elite vision-indispensable multimodal benchmark via lmms-eval"
    suite: lmms_eval
    metric: average
    n_shots: [0]
    tasks:
      - task: mmstar
        dataset: Lin-Chen/MMStar

  image-ai2d:
    description: "AI2D diagram multiple-choice VQA via lmms-eval"
    suite: lmms_eval
    metric: exact_match
    n_shots: [0]
    tasks:
      - task: ai2d
        dataset: lmms-lab/ai2d

  image-mathvision:
    description: "MathVision math reasoning over images (test split, rule-based) via lmms-eval"
    suite: lmms_eval
    metric: mathvision_standard_eval
    n_shots: [0]
    tasks:
      - task: mathvision_test
        dataset: MathLLMs/MathVision

  image-seedbench:
    description: "SEED-Bench image multiple-choice (seed_image submetric) via lmms-eval"
    suite: lmms_eval
    metric: seed_image
    n_shots: [0]
    tasks:
      - task: seedbench
        dataset: lmms-lab/SEED-Bench

  # ── Video Modality (lmms-eval) ────────────────────────────────────────────
  video-understanding:
    description: "Video understanding benchmarks via lmms-eval (VideoMMMU, MVBench, EgoSchema-subset, VideoMME, ActivityNet-QA, LongVideoBench)"
    suite: lmms_eval
    n_shots: [0]
    tasks:
      - task: video_mmmu_perception
        metric: mmmu_acc
        dataset: lmms-lab/VideoMMMU
      - task: video_mmmu_comprehension
        metric: mmmu_acc
        dataset: lmms-lab/VideoMMMU
      - task: video_mmmu_adaptation
        metric: mmmu_acc
        dataset: lmms-lab/VideoMMMU
      - task: mvbench
        metric: mvbench_accuracy  # group of 20 subtasks; collect aggregates the per-subtask values into one row
        dataset: OpenGVLab/MVBench
        # MVBench parquet on `main`, .mp4 files on `video` — fetch both.
        revisions: [main, video]
      - task: egoschema_subset
        metric: score  # val split with ground truth; bare `egoschema` is Kaggle-submission-only
        dataset: lmms-lab/egoschema
      - task: videomme
        metric: videomme_perception_score  # IS the overall accuracy despite the name
        dataset: lmms-lab/Video-MME
      - task: activitynetqa
        metric: gpt_eval_accuracy  # needs GPT API access (LLM-as-judge)
        dataset: lmms-lab/ActivityNetQA
      - task: longvideobench_val_v
        metric: lvb_acc
        dataset: longvideobench/LongVideoBench

  # ── Individual Video Benchmarks (single-task groups for targeted runs) ────
  video-videommmu:
    description: "VideoMMMU multi-discipline video understanding via lmms-eval (perception / comprehension / adaptation leaves)"
    suite: lmms_eval
    metric: mmmu_acc
    n_shots: [0]
    dataset: lmms-lab/VideoMMMU
    tasks:
      - task: video_mmmu_perception
      - task: video_mmmu_comprehension
      - task: video_mmmu_adaptation

  video-mvbench:
    description: "MVBench short-clip temporal video understanding via lmms-eval (group of 20 subtasks; mean accuracy)"
    suite: lmms_eval
    metric: mvbench_accuracy
    n_shots: [0]
    tasks:
      - task: mvbench
        dataset: OpenGVLab/MVBench
        # MVBench parquet on `main`, .mp4 files on `video` — fetch both.
        revisions: [main, video]

  video-egoschema:
    description: "EgoSchema long-form egocentric video QA via lmms-eval (500-q validation subset with ground truth)"
    suite: lmms_eval
    metric: score
    n_shots: [0]
    tasks:
      - task: egoschema_subset
        dataset: lmms-lab/egoschema

  video-videomme:
    description: "Video-MME full-spectrum video understanding (11s-1h) via lmms-eval"
    suite: lmms_eval
    metric: videomme_perception_score
    n_shots: [0]
    tasks:
      - task: videomme
        dataset: lmms-lab/Video-MME

  video-activitynet-qa:
    description: "ActivityNet-QA open-ended activity video QA via lmms-eval (requires GPT API for scoring)"
    suite: lmms_eval
    metric: gpt_eval_accuracy
    n_shots: [0]
    tasks:
      - task: activitynetqa
        dataset: lmms-lab/ActivityNetQA

  video-longvideobench:
    description: "LongVideoBench long-video cross-segment reasoning via lmms-eval"
    suite: lmms_eval
    metric: lvb_acc
    n_shots: [0]
    tasks:
      - task: longvideobench_val_v
        dataset: longvideobench/LongVideoBench

  # Every task below MUST be a leaf (metric-emitting) task. Group names like
  # air_bench_chat / common_voice_15 / fleurs expand to subtask keys at runtime,
  # breaking the jobs.csv ↔ results.json match in _resolve_metric. Judge-model
  # benchmarks live in individual audio-* groups and need OPENAI_API_KEY.
  audio-understanding:
    description: "Curated audio benchmark suite via lmms-eval — ASR (LibriSpeech, FLEURS en, GigaSpeech, TED-LIUM, WenetSpeech meeting), speech translation (CoVoST2 en→zh), audio classification (VocalSound) and music understanding (MuChoMusic). No judge-model dependency."
    suite: lmms_eval
    n_shots: [0]
    tasks:
      - task: librispeech_test_clean
        metric: wer
        dataset: lmms-lab/librispeech
      - task: fleurs_en
        metric: wer
        dataset: lmms-lab/fleurs
      - task: gigaspeech_test
        metric: wer
        dataset: lmms-lab/gigaspeech
      - task: tedlium_dev_test
        metric: wer
        dataset: lmms-lab/tedlium
      - task: wenet_speech_test_meeting
        metric: mer
        dataset: lmms-lab/WenetSpeech
      - task: covost2_en_zh_test
        metric: bleu
        dataset: lmms-lab/covost2_en-zh
      - task: vocalsound_test
        metric: accuracy
        dataset: lmms-lab/vocalsound
      - task: muchomusic
        metric: accuracy
        dataset: lmms-lab/muchomusic

  audio-librispeech:
    description: "LibriSpeech ASR benchmark via lmms-eval (WER on test-clean)"
    suite: lmms_eval
    metric: wer
    n_shots: [0]
    tasks:
      - task: librispeech_test_clean
        dataset: lmms-lab/librispeech

  audio-librispeech-all:
    description: "LibriSpeech all four splits (dev-clean, dev-other, test-clean, test-other) via lmms-eval"
    suite: lmms_eval
    metric: wer
    n_shots: [0]
    dataset: lmms-lab/librispeech
    tasks:
      - task: librispeech_dev_clean
      - task: librispeech_dev_other
      - task: librispeech_test_clean
      - task: librispeech_test_other

  audio-common-voice-15:
    description: "Common Voice 15 multilingual ASR via lmms-eval (en, fr, zh-CN leaf subtasks)"
    suite: lmms_eval
    metric: wer
    n_shots: [0]
    dataset: lmms-lab/common_voice_15
    tasks:
      - task: common_voice_15_en
      - task: common_voice_15_fr
      - task: common_voice_15_zh-CN

  audio-gigaspeech:
    description: "GigaSpeech large-scale ASR via lmms-eval"
    suite: lmms_eval
    metric: wer
