                  eus_Latn, glg_Latn, bos_Latn, kat_Geor, mkd_Cyrl, als_Latn,
                  srp_Cyrl, tur_Latn, ukr_Cyrl, isl_Latn, nob_Latn]
    tasks:
      - task: "flores200_{lang}-eng_Latn_bpb"
