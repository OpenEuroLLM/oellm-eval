      - task: "global_piqa_completions_{lang}"
        subset: "{lang}"

  global-piqa-eu-prompted:
    description: "Global PIQA European languages — prompted generation (0-shot, mrlbenchmarks/global-piqa-nonparallel)"
    suite: lm-eval-harness
    n_shots: [0]
    dataset: mrlbenchmarks/global-piqa-nonparallel
    valid_langs: [als_latn, bos_latn, bul_cyrl, cat_latn, ces_latn, deu_latn, ekk_latn, ell_grek,
                  eng_latn, fin_latn, fra_latn_fran, glg_latn, hrv_latn, hun_latn, isl_latn, ita_latn,
                  kat_geor, lit_latn, mkd_cyrl, nld_latn, nno_latn, nob_latn, pol_latn, por_latn_port,
                  ron_latn, slk_latn, slv_latn, spa_latn_spai, srp_cyrl, swe_latn, tur_latn, ukr_cyrl]
    tasks:
      - task: "global_piqa_prompted_{lang}"
        subset: "{lang}"

  # PolyMath ships 4 difficulty tiers (low/medium/high/top); each is a
  # separate group so a tier can be run in isolation. EU languages only
  # (de/en/es/fr/it/pt); 0-shot generative, \boxed{} answer + exact_match.
  polymath-eu-low:
    description: "PolyMath EU math, low tier (0-shot, exact_match)."
    suite: lm-eval-harness
    n_shots: [0]
    dataset: Qwen/PolyMath
    valid_langs: [de, en, es, fr, it, pt]
    tasks:
      - task: "polymath_{lang}_low"
        subset: "{lang}"

  polymath-eu-medium:
    description: "PolyMath EU math, medium tier (0-shot, exact_match)."
    suite: lm-eval-harness
    n_shots: [0]
    dataset: Qwen/PolyMath
    valid_langs: [de, en, es, fr, it, pt]
    tasks:
      - task: "polymath_{lang}_medium"
        subset: "{lang}"

  polymath-eu-high:
    description: "PolyMath EU math, high tier (0-shot, exact_match)."
    suite: lm-eval-harness
    n_shots: [0]
    dataset: Qwen/PolyMath
    valid_langs: [de, en, es, fr, it, pt]
    tasks:
      - task: "polymath_{lang}_high"
        subset: "{lang}"

  polymath-eu-top:
    description: "PolyMath EU math, top/Olympiad tier (0-shot, exact_match)."
    suite: lm-eval-harness
    n_shots: [0]
    dataset: Qwen/PolyMath
    valid_langs: [de, en, es, fr, it, pt]
    tasks:
      - task: "polymath_{lang}_top"
        subset: "{lang}"

  # ------------------------------------------------------------------
  # BPB (bits-per-byte) groups.
  #
  # These score the *gold* continuation's loglikelihood normalised by its
  # UTF-8 byte length, instead of argmax accuracy. At swarm scale (30M-150M
  # params, a few B tokens) accuracy on these benchmarks sits near chance and
  # is dominated by noise, which makes it a poor regression target; BPB is
  # continuous, strictly decreasing with model quality, and is what
  # DCLM/OLMo/Olmix fit data-mixture regressors on.
  #
  # Task definitions live in custom_lm_eval_tasks/bpb/ and are picked up via
  # the default --include_path.
  # ------------------------------------------------------------------
  bpb-core:
    description: "Bits-per-byte on the DCLM/Olmix core multiple-choice benchmarks (0-shot)"
    suite: lm-eval-harness
    n_shots: [0]
    tasks:
      - task: arc_easy_bpb
        dataset: allenai/ai2_arc
        subset: ARC-Easy
      - task: arc_challenge_bpb
        dataset: allenai/ai2_arc
        subset: ARC-Challenge
      - task: hellaswag_bpb
        dataset: Rowan/hellaswag
      - task: piqa_bpb
        dataset: baber/piqa
      - task: openbookqa_bpb
        dataset: allenai/openbookqa
        subset: main
      - task: boolq_bpb
        dataset: aps/super_glue
        subset: boolq
      - task: copa_bpb
        dataset: aps/super_glue
        subset: copa
      - task: commonsense_qa_bpb
        dataset: tau/commonsense_qa
      - task: social_iqa_bpb
        dataset: allenai/social_i_qa
      - task: winogrande_bpb
        dataset: allenai/winogrande
        subset: winogrande_xl

  bpb-mmlu-stem:
    description: "Bits-per-byte on MMLU STEM subjects, cloze form (0-shot)"
    suite: lm-eval-harness
    n_shots: [0]
    dataset: cais/mmlu
    tasks:
      - task: mmlu_abstract_algebra_bpb
        subset: abstract_algebra
      - task: mmlu_anatomy_bpb
        subset: anatomy
      - task: mmlu_astronomy_bpb
        subset: astronomy
      - task: mmlu_college_biology_bpb
        subset: college_biology
      - task: mmlu_college_chemistry_bpb
        subset: college_chemistry
      - task: mmlu_college_computer_science_bpb
        subset: college_computer_science
      - task: mmlu_college_mathematics_bpb
        subset: college_mathematics
      - task: mmlu_college_physics_bpb
        subset: college_physics
      - task: mmlu_computer_security_bpb
        subset: computer_security
      - task: mmlu_conceptual_physics_bpb
        subset: conceptual_physics
      - task: mmlu_electrical_engineering_bpb
        subset: electrical_engineering
      - task: mmlu_elementary_mathematics_bpb
        subset: elementary_mathematics
      - task: mmlu_high_school_biology_bpb
        subset: high_school_biology
      - task: mmlu_high_school_chemistry_bpb
        subset: high_school_chemistry
      - task: mmlu_high_school_computer_science_bpb
        subset: high_school_computer_science
      - task: mmlu_high_school_mathematics_bpb
        subset: high_school_mathematics
      - task: mmlu_high_school_physics_bpb
        subset: high_school_physics
      - task: mmlu_high_school_statistics_bpb
        subset: high_school_statistics
      - task: mmlu_machine_learning_bpb
        subset: machine_learning

  # ------------------------------------------------------------------
  # Multilingual BPB groups: the BPB counterparts of the oellm-multilingual
  # super group, with the same conventions as the English BPB groups above
  # (0-shot; multiple-choice exams in cloze form). FLORES and MGSM score a
  # single reference (translation / final answer number) instead of a choice.
  # Task definitions live in custom_lm_eval_tasks/bpb/<benchmark>/.
