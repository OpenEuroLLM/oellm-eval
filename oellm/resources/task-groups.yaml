super_groups:
  oellm-multilingual:
    description: "Combined Belebele EU set plus multilingual benchmarks"
    task_groups:
      - task: flores-200-eu-to-eng
      - task: flores-200-eng-to-eu
      - task: belebele-eu-5-shot
      - task: global-mmlu-eu
      - task: mgsm-eu
      - task: generic-multilingual
      - task: include

  bpb-all:
    description: "All BPB benchmarks: core multiple-choice plus MMLU STEM"
    task_groups:
      - task: bpb-core
      - task: bpb-mmlu-stem

  oellm-multilingual-bpb:
    description: "Bits-per-byte counterparts of the oellm-multilingual benchmarks"
    task_groups:
      - task: flores-200-eu-to-eng-bpb
      - task: flores-200-eng-to-eu-bpb
      - task: belebele-eu-bpb
      - task: global-mmlu-eu-bpb
      - task: mgsm-eu-bpb
      - task: xwinograd-bpb
