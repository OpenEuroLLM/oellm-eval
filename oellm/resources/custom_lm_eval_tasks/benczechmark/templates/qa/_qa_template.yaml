include:
 - ../_n_shot.yaml
 - ../metrics/_qa_metrics.yaml
test_split: test
training_split: test
fewshot_split: test
output_type: generate_until
doc_to_target: "{{answers}}"

filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first

target_delimiter: " "
fewshot_delimiter: "\n\n"
